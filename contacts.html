<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Emos Been | CONTACT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: Arial, sans-serif; color: white; }
        .container { max-width: 1000px; margin: 0 auto; padding: 16px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .menu-icon { font-size: 24px; cursor: pointer; }
        .site-title { font-size: 14px; letter-spacing: 3px; }
        .site-title a { color: white; text-decoration: none; }
        .sidebar { height: 100%; width: 0; position: fixed; top: 0; left: 0; background-color: #0a0a0a; overflow-x: hidden; transition: 0.3s; padding-top: 60px; z-index: 100; border-right: 1px solid #222; }
        .sidebar a { padding: 14px 25px; text-decoration: none; font-size: 16px; color: white; display: block; transition: 0.2s; letter-spacing: 1px; cursor: pointer; }
        .sidebar a:hover { background: #25D366; color: black; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; }
        .hero-image { width: 100%; height: 380px; background-image: url('https://i.imgur.com/dSmdTJL.png'); background-size: cover; background-position: center; border-radius: 24px; margin: 20px 0; }
        .page-title { text-align: center; font-size: 2rem; letter-spacing: 4px; margin: 30px 0; }
        .contact-grid { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin: 50px 0; }
        .contact-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 60px; padding: 25px 45px; text-align: center; transition: 0.2s; text-decoration: none; color: white; display: inline-block; }
        .contact-card:hover { transform: scale(1.05); background: #25D366; border-color: #25D366; color: black; }
        .contact-icon { font-size: 2.5rem; margin-bottom: 10px; display: block; }
        .contact-name { font-size: 1.1rem; letter-spacing: 1px; font-weight: bold; }
        .footer { text-align: center; padding: 25px; font-size: 0.7rem; color: #555; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 40px; }
        @media (max-width: 768px) { .hero-image { height: 260px; } .contact-card { padding: 18px 30px; } }
    </style>
</head>

<div id="sidebar" class="sidebar">

    </div>

    <div class="hero-image"></div>

    <div class="contact-grid">

        </a>
        <a href="mailto:emosbeen6@gmail.com" class="contact-card" target="_blank">
            <i class="far fa-envelope contact-icon"></i>

</html>
