<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emos Been | MATA RUWA Out Now</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: white;
            overflow-x: hidden;
        }

        /* Hero section - full screen, no scroll needed */
        .hero {
            height: 100vh;
            width: 100%;
            background-image: url('https://i.imgur.com/3k2lwiL.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 40px 60px;
        }

        /* Dark overlay for text readability */
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.45);
            z-index: 1;
        }

        .hero > * {
            position: relative;
            z-index: 2;
        }

        /* Top bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .site-title {
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 3px;
        }

        .site-title a {
            color: white;
            text-decoration: none;
        }

        .nav {
            display: flex;
            gap: 28px;
        }

        .nav a {
            color: white;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            transition: opacity 0.2s;
        }

        .nav a:hover {
            opacity: 0.6;
        }

        /* Center content */
        .center-content {
            text-align: center;
            margin-top: -40px;
        }

        .album-title {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .featured-artist {
            font-size: 1rem;
            letter-spacing: 2px;
            color: #ddd;
            margin-bottom: 25px;
        }

        .listen-btn {
            display: inline-block;
            background: white;
            color: black;
            padding: 10px 32px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 2.5px;
            border-radius: 40px;
            transition: all 0.2s ease;
        }

        .listen-btn:hover {
            background: #e0e0e0;
            transform: scale(0.97);
        }

        /* Bottom section - compact tour + merch row */
        .bottom-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 30px;
            flex-wrap: wrap;
        }

        .tour-preview h4, .merch-preview h4 {
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: #aaa;
            margin-bottom: 10px;
        }

        .tour-dates {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .tour-date-item {
            font-size: 0.7rem;
            border-right: 1px solid rgba(255,255,255,0.3);
            padding-right: 20px;
        }
        .tour-date-item:last-child {
            border-right: none;
            padding-right: 0;
        }
        .tour-city {
            font-weight: 600;
        }
        .tour-date-sm {
            color: #aaa;
            font-size: 0.65rem;
        }

        .merch-items {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .merch-item {
            text-align: right;
        }
        .merch-name {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .merch-price {
            font-size: 0.65rem;
            color: #aaa;
        }
        .signed-badge-sm {
            font-size: 0.6rem;
            border: 0.5px solid rgba(255,255,255,0.4);
            padding: 2px 6px;
            border-radius: 20px;
            margin-left: 6px;
        }

        /* Social links - compact footer */
        .social-footer {
            position: fixed;
            bottom: 15px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 10;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .social-link {
            color: white;
            text-decoration: none;
            font-size: 0.7rem;
            padding: 5px 14px;
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 30px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }
        .social-link:hover {
            background: white;
            color: black;
        }

        /* Mobile adjustments */
        @media (max-width: 850px) {
            .hero {
                padding: 20px 20px 40px;
            }
            .album-title {
                font-size: 2.2rem;
                letter-spacing: 2px;
            }
            .bottom-info {
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 20px;
            }
            .merch-item, .tour-date-item {
                text-align: center;
                border-right: none;
            }
            .tour-dates {
                justify-content: center;
            }
            .merch-items {
                justify-content: center;
            }
            .social-footer {
                bottom: 8px;
            }
            .social-link {
                padding: 4px 10px;
                font-size: 0.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="hero">
        <!-- Top bar -->
        <div class="top-bar">
            <div class="site-title">
                <a href="#">EMOS BEEN</a>
            </div>
            <div class="nav">
                <a href="#">MUSIC</a>

                <a href="#">STORE</a>
            </div>
        </div>

        <!-- Center: song info -->
        <div class="center-content">
            <div class="album-title">MATA RUWA</div>
            <div class="featured-artist">ft. Wreal X</div>
            <a href="#" class="listen-btn">LISTEN NOW</a>

        <!-- Bottom: compact tour dates + merch preview -->
        <div class="bottom-info">
            <div class="tour-preview">
                <h4>NEXT SHOWS</h4>
                <div class="tour-dates">
                    <div class="tour-date-item">
                        <div class="tour-city">LA</div>

                    </div>
                    <div class="tour-date-item">

                    </div>
                    <div class="tour-date-item">
                        <div class="tour-city">CHI</div>
                        <div class="tour-date-sm">MAY 22</div>

                    <div class="tour-date-item">
                        <div class="tour-city">NYC</div>
                        <div class="tour-date-sm">MAY 25</div>
                    </div>
                </div>
            </div>
            <div class="merch-preview">
                <h4>MERCH</h4>
                <div class="merch-items">
                    <div class="merch-item">
                        <div class="merch-name">SIGNED CD</div>
                        <div class="merch-price">$15</div>
                    </div>
                    <div class="merch-item">
                        <div class="merch-name">LIMITED VINYL</div>
                        <div class="merch-price">$33 <span class="signed-badge-sm">SIGNED</span></div>
                    </div>
                    <div class="merch-item">
                        <div class="merch-name">DROPS HOODIE</div>
                        <div class="merch-price">$65</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Social links fixed at bottom -->
    <div class="social-footer">
        <div class="social-links">
            <a href="https://youtube.com/@emos_been" class="social-link" target="_blank">▶ YOUTUBE</a>
            <a href="https://audiomack.com/emos_been" class="social-link" target="_blank">🎵 AUDIOMACK</a>
            <a href="https://www.instagram.com/emos_been" class="social-link" target="_blank">📸 INSTAGRAM</a>
            <a href="https://www.facebook.com/Emosbess" class="social-link" target="_blank">👍 FACEBOOK</a>
        </div>
    </div>

</body>
                        </html>
